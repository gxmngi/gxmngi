  <g class="mono-text layer-dump" xml:space="preserve">
      <text x="36" y="106.0" xml:space="preserve">00000000  bb 54 aa c4 b8 9d c8 68 ba 37 d9 cc     |.T.....h.7..|</text>\n      <text x="36" y="124.5" xml:space="preserve">00000010  21 b2 ce ce 9f 09 b4 3c eb 7e 57 a0     |!......&lt;.~W.|</text>\n      <text x="36" y="143.0" xml:space="preserve">00000020  ea 87 66 22 16 24 d0 1b 08 64 64 35     |..f&quot;.$...dd5|</text>\n      <text x="36" y="161.5" xml:space="preserve">00000030  91 64 e7 a0 06 aa dd 75 17 9d 6d 5c     |.d.....u..m\|</text>\n      <text x="36" y="180.0" xml:space="preserve">00000040  5e 19 fd e9 0c f9 b4 83 86 22 42 1e     |^........&quot;B.|</text>\n      <text x="36" y="198.5" xml:space="preserve">00000050  57 a1 28 62 e1 81 1b 4c da b2 15 dc     |W.(b...L....|</text>\n      <text x="36" y="217.0" xml:space="preserve">00000060  93 4f 1c ec b1 c2 23 6a b4 86 6d 62     |.O....#j..mb|</text>\n      <text x="36" y="235.5" xml:space="preserve">00000070  45 f7 c8 db 81 51 71 aa c9 63 d5 51     |E....Qq..c.Q|</text>\n      <text x="36" y="254.0" xml:space="preserve">00000080  f0 a4 14 0f 62 df 9d a1 ce b7 73 9c     |....b.....s.|</text>\n      <text x="36" y="272.5" xml:space="preserve">00000090  e1 c2 c2 49 8d 79 c5 2b eb 01 af 2b     |...I.y.+...+|</text>\n      <text x="36" y="291.0" xml:space="preserve">000000a0  8c fb c7 47 13 c1 64 e3 3a 7c 9a 1a     |...G..d.:|..|</text>\n      <text x="36" y="309.5" xml:space="preserve">000000b0  fb 6c b6 a8 8d 34 4e 16 fe 97 08 4c     |.l...4N....L|</text>\n      <text x="36" y="328.0" xml:space="preserve">000000c0  4b ee 29 fa ea 0a 59 62 53 79 72 15     |K.)...YbSyr.|</text>\n      <text x="36" y="346.5" xml:space="preserve">000000d0  e1 ec cf 9d a0 0c da b4 34 56 29 07     |........4V).|</text>\n      <text x="36" y="365.0" xml:space="preserve">000000e0  99 63 50 64 36 28 51 cf 7d 1e dc 74     |.cPd6(Q.}..t|</text>
  </g>

  <!-- LAYER 2: HARDWARE CHIP DIE & MONOGRAM (Active 4.2s - 8.0s) -->
  <g class="mono-text layer-chip" xml:space="preserve">
      <text x="36" y="106.0" xml:space="preserve">+--------------------------------------------------------------+</text>\n      <text x="36" y="124.5" xml:space="preserve">| [CPU-0]   R  U  S  D  A  N   SYSTEMS ARCHITECTURE   [x86_64] |</text>\n      <text x="36" y="143.0" xml:space="preserve">+--------------------------------------------------------------+</text>\n      <text x="36" y="161.5" xml:space="preserve">| [BUS] 0x00 --[ HIGH-PERFORMANCE KERNEL ]-- 0xFF  [L1: 64KB] |</text>\n      <text x="36" y="180.0" xml:space="preserve">| +--+ +--+ +--+ +--+   ===================   +--+ +--+ +--+ + |</text>\n      <text x="36" y="198.5" xml:space="preserve">| |R | |U | |S | |D |   | ####  #  #  ### |   |A | |N | |0 | | |</text>\n      <text x="36" y="217.0" xml:space="preserve">| |--| |--| |--| |--|   | #  #  #  # #    |   |--| |--| |--| | |</text>\n      <text x="36" y="235.5" xml:space="preserve">| |  | |  | |  | |  |   | ####  #  #  ##  |   |  | |  | |  | | |</text>\n      <text x="36" y="254.0" xml:space="preserve">| |  | |  | |  | |  |   | # #   #  #    # |   |  | |  | |  | | |</text>\n      <text x="36" y="272.5" xml:space="preserve">| +--+ +--+ +--+ +--+   | #  #   ##  ###  |   +--+ +--+ +--+ + |</text>\n      <text x="36" y="291.0" xml:space="preserve">| [MEM: 256GB ECC]      ===================    [LATENCY: 12ns] |</text>\n      <text x="36" y="309.5" xml:space="preserve">| [RACK-UNIT 01]  [PWR: OK]  [TEMP: 32C]  [FANS: 4800RPM] [UP] |</text>\n      <text x="36" y="328.0" xml:space="preserve">| [ETHERNET 100G] ============================= [PACKETS 100M] |</text>\n      <text x="36" y="346.5" xml:space="preserve">| [CHIP DIE: 4nm]  :: DETERMINISTIC EXECUTION :: ZERO LOOKAHEAD|</text>\n      <text x="36" y="365.0" xml:space="preserve">+--------------------------------------------------------------+</text>
  </g>

  <!-- Footer Status Bar -->
  <line x1="1" y1="384" x2="719" y2="384" stroke="var(--border-color)" stroke-width="1" />
  <text x="36" y="406" class="footer-cli">
    <tspan fill="var(--accent-green)">● ONLINE</tspan>
    <tspan fill="var(--text-muted)"> | ARCH: x86_64 | 12ns LATENCY | ZERO-LOOKAHEAD INVARIANT</tspan>
  </text>
  <text x="684" y="406" text-anchor="end" class="footer-cli">
    <tspan fill="var(--accent-blue)">120 FPS</tspan>
  </text>
</svg>
