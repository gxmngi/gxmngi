<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');

      :root {
        --bg-color: #FFFFFF;
        --border-color: #E1E4E8;
        --card-bg: #FAFAFB;
        --header-bg: #F6F8FA;
        --text-primary: #1F2328;
        --text-muted: #6E7781;
        --accent-blue: #0969DA;
        --accent-cyan: #056FF7;
        --accent-green: #1A7F37;
        --dot-red: #FF5F56;
        --dot-yellow: #FFBD2E;
        --dot-green: #27C93F;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #0D1117;
          --border-color: #30363D;
          --card-bg: #161B22;
          --header-bg: #161B22;
          --text-primary: #E6EDF3;
          --text-muted: #8B949E;
          --accent-blue: #58A6FF;
          --accent-cyan: #79C0FF;
          --accent-green: #3FB950;
          --dot-red: #FF5F56;
          --dot-yellow: #FFBD2E;
          --dot-green: #27C93F;
        }
      }

      .bg-rect {
        fill: var(--card-bg);
        stroke: var(--border-color);
        stroke-width: 1;
        rx: 10;
      }

      .header-bar {
        fill: var(--header-bg);
        stroke: var(--border-color);
        stroke-width: 1;
      }

      .header-title {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: var(--text-muted);
        text-anchor: middle;
      }

      .header-tag {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11px;
        font-weight: 600;
        fill: var(--accent-blue);
      }

      .mono-text {
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace;
        font-size: 12.8px;
        letter-spacing: 0px;
        white-space: pre;
      }

      /* Auto-Morph Keyframe Animation Timeline (8s loop) */
      @keyframes fadeDump {
        0%, 46% {
          opacity: 1;
          visibility: visible;
        }
        49%, 97% {
          opacity: 0;
          visibility: hidden;
        }
        100% {
          opacity: 1;
          visibility: visible;
        }
      }

      @keyframes fadeChip {
        0%, 47% {
          opacity: 0;
          visibility: hidden;
        }
        51%, 95% {
          opacity: 1;
          visibility: visible;
        }
        99%, 100% {
          opacity: 0;
          visibility: hidden;
        }
      }

      .layer-dump {
        animation: fadeDump 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        fill: var(--text-primary);
      }

      .layer-chip {
        animation: fadeChip 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        fill: var(--accent-blue);
      }

      .footer-cli {
        font-family: 'JetBrains Mono', monospace;
        font-size: 11.5px;
        fill: var(--text-muted);
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect x="1" y="1" width="718" height="418" class="bg-rect" />

  <!-- Window Header -->
  <path d="M 1 10 C 1 5, 5 1, 10 1 L 710 1 C 715 1, 719 5, 719 10 L 719 36 L 1 36 Z" class="header-bar" />
  
  <!-- Traffic Light Dots -->
  <circle cx="20" cy="19" r="5" fill="var(--dot-red)" />
  <circle cx="36" cy="19" r="5" fill="var(--dot-yellow)" />
  <circle cx="52" cy="19" r="5" fill="var(--dot-green)" />

  <!-- Breadcrumb Title -->
  <text x="360.0" y="23" class="header-title">rusdan / technology — hardware die</text>
  <text x="696" y="23" text-anchor="end" class="header-tag">AUTO-SYNC</text>

  <!-- Terminal State Indicator -->
  <text x="36" y="68" class="footer-cli">
    <tspan fill="var(--accent-cyan)" font-weight="600">~ $ </tspan>
    <tspan fill="var(--text-primary)" font-weight="500">hexdump -C kernel.bin </tspan>
    <tspan fill="var(--text-muted)">// morphing to silicon die...</tspan>
  </text>

