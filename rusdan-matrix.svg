<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');

      :root {
        --text-primary: #1F2328;
        --text-muted: #6E7781;
        --accent-blue: #0969DA;
        --accent-cyan: #056FF7;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --text-primary: #E6EDF3;
          --text-muted: #8B949E;
          --accent-blue: #58A6FF;
          --accent-cyan: #79C0FF;
        }
      }

      .mono-text {
        font-family: 'JetBrains Mono', 'SF Mono', Menlo, Monaco, Consolas, monospace;
        font-size: 13px;
        letter-spacing: 0px;
        white-space: pre;
      }

      .cli-prompt {
        font-family: 'JetBrains Mono', monospace;
        font-size: 12.5px;
        letter-spacing: -0.01em;
      }

      /* Auto-Morph Keyframe Animation Timeline (8s loop) */
      @keyframes fadeDump {
        0%, 46% {
          opacity: 1;
          visibility: visible;
        }
        49%, 97% {
          opacity: 0;
          visibility: hidden;
        }
        100% {
          opacity: 1;
          visibility: visible;
        }
      }

      @keyframes fadeChip {
        0%, 47% {
          opacity: 0;
          visibility: hidden;
        }
        51%, 95% {
          opacity: 1;
          visibility: visible;
        }
        99%, 100% {
          opacity: 0;
          visibility: hidden;
        }
      }

      .layer-dump {
        animation: fadeDump 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        fill: var(--text-primary);
      }

      .layer-chip {
        animation: fadeChip 8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
        fill: var(--accent-blue);
      }
    </style>
  </defs>

  <!-- Prompt Header (Borderless & Clean) -->
  <text x="10" y="24" class="cli-prompt">
    <tspan fill="var(--accent-cyan)" font-weight="600">~ $ </tspan>
    <tspan fill="var(--text-primary)" font-weight="500">hexdump -C kernel.bin </tspan>
    <tspan fill="var(--text-muted)">// morphing to silicon die...</tspan>
  </text>

